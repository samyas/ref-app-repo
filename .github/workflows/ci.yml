name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch cancels the previous PR run,
# but a run on main or a tag is never cancelled mid-publish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default: jobs that need more ask for it explicitly.
permissions:
  contents: read

env:
  NODE_VERSION: "20"
  GITLEAKS_VERSION: "8.21.2"       # check the releases page and bump when needed
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 1. Unit / HTTP tests -------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm            # needs package-lock.json in the repo

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # 2. Secret detection over the whole Git history ------------------------------
  secret-scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history, so old commits are scanned too

      - name: Install Gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${archive}"
          curl -sSfLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${archive}" gitleaks

      - name: Scan repository
        # --redact hides the secret value in the logs; exit code 1 fails the job
        run: ./gitleaks detect --source . --redact --verbose --no-banner

  # 3. Build, scan with Trivy, then publish only if the scan passes -------------
  build-scan-publish:
    name: Build, Trivy scan, publish
    needs: [test, secret-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write           # push to GitHub Container Registry
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build once locally (not pushed) so it can be scanned first.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: app:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (fails on HIGH / CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: app:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true  # skip vulnerabilities with no available fix
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      # Everything below runs only for pushes to main and version tags, never for PRs.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Immutable commit tag (sha-xxxxxxx), plus the version on a v* tag.
          # No "latest" tag on purpose: deployments must pin an exact version.
          tags: |
            type=sha,format=short
            type=ref,event=tag

      - name: Publish image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          echo "### Image published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"